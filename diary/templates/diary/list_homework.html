{% extends "diary/base.html" %}

{% block title %}Homework{% endblock title %}

{% block content %}
    <ul>
        <li><a href="{% url "diary:all_subjects" %}">My subjects</a></li>
    </ul>
    <h2>Homework</h2>
    <ul>
        {% for homework in object_list %}
            <li>{{ homework.subject}}: {{ homework.title }} {{ homework.deadline }}</li>
        {% endfor %}
    </ul>
{% endblock content %}
