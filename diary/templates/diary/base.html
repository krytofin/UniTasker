<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>
    {% block header %}

    {% endblock header %}
    <style>
        :root {
            --ink: #0f172a;
            --ink-soft: #475569;
            --ink-faint: #94a3b8;
            --paper: #f8fafc;
            --surface: #ffffff;
            --line: #e2e8f0;
            --accent: #3b82f6;
            --accent-soft: #eff6ff;
            --accent-dark: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
        }

        a { color: inherit; }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .site-header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
            flex-shrink: 0;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .site-nav {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            padding: 0;
        }

        .site-nav a {
            display: flex;
            align-items: center;
            white-space: nowrap;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-soft);
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }

        .site-nav a:hover {
            background: var(--accent-soft);
            color: var(--accent-dark);
        }

        .site-nav a.nav-action {
            background: var(--accent);
            color: #fff;
        }
        .site-nav a.nav-action:hover {
            background: var(--accent-dark);
            color: #fff;
        }

        .nav-toggle {
            display: none;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .nav-toggle:hover { background: var(--accent-soft); }

        .nav-toggle svg { width: 22px; height: 22px; }
        .nav-toggle .icon-close { display: none; }

        /* ---- Page shell ---- */
        .page-body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }

        @media (max-width: 760px) {
            .nav-toggle { display: flex; }

            .site-nav {
                position: fixed;
                top: 64px;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 19;
                background: var(--surface);
                flex-direction: column;
                align-items: stretch;
                gap: 2px;
                padding: 12px;
                overflow-y: auto;

                /* hidden by default */
                display: none;
            }

            body.nav-open .site-nav { display: flex; }
            body.nav-open { overflow: hidden; }

            body.nav-open .nav-toggle .icon-burger { display: none; }
            body.nav-open .nav-toggle .icon-close { display: block; }

            .site-nav li { width: 100%; }

            .site-nav a {
                width: 100%;
                padding: 14px 16px;
                font-size: 16px;
                border-radius: 10px;
            }

            .site-nav a.nav-action {
                justify-content: center;
                margin-top: 8px;
            }
        }
    </style>
    {% block css %}

    {% endblock css %}
</head>
<body>

    <header class="site-header">
        <div class="site-header-inner">
            <a href="{% url "diary:all_homework" %}" class="brand">
                <span class="brand-mark">📕</span>
                <span>UniTasker</span>
            </a>

            <ul class="site-nav" id="siteNav">
                <li><a href="{% url "diary:all_subjects" %}">My subjects</a></li>
                <li><a href="{% url "diary:all_homework" %}">My homework</a></li>
                <li><a href="{% url "diary:archive_subject_view" %}">Archived subjects</a></li>
                <li><a href="{% url "diary:create_subject" %}" class="nav-action">+ Subject</a></li>
                <li><a href="{% url "diary:create_homework" %}" class="nav-action">+ Homework</a></li>
            </ul>

            <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="siteNav">
                <svg class="icon-burger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
    </header>

    <main class="page-body">
        {% block content %}

        {% endblock content %}
    </main>

    <script>
        (function () {
            var toggle = document.getElementById('navToggle');
            var nav = document.getElementById('siteNav');

            toggle.addEventListener('click', function () {
                var isOpen = document.body.classList.toggle('nav-open');
                toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            // Закрыть меню при клике на пункт меню или при возврате на десктопную ширину
            nav.addEventListener('click', function (e) {
                if (e.target.tagName === 'A') {
                    document.body.classList.remove('nav-open');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });

            window.addEventListener('resize', function () {
                if (window.innerWidth > 760) {
                    document.body.classList.remove('nav-open');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>

</body>
</html>
